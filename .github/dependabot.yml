version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jayapura"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      starlight:
        patterns:
          - "@astrojs/starlight"
          - "starlight-*"
      dev-tools:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "prettier*"
          - "husky"
          - "lint-staged"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
