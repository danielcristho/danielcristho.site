<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Types of concept drift</title>
  <desc>Sudden, gradual, incremental drift and reoccurring concepts, as data distribution over time. Blue is the old concept, green the new one.</desc>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
