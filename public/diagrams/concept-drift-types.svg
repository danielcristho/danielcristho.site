  </defs>

  <rect x="0" y="0" width="900" height="468" fill="#ffffff"/>

  <!-- sudden -->
  <text x="120" y="68" text-anchor="end" font-weight="bold" fill="#222222">Sudden</text>
  <text x="120" y="84" text-anchor="end" font-weight="bold" fill="#222222">Drift</text>
  <text x="142" y="60" text-anchor="middle" font-size="10" fill="#444444" transform="rotate(-90 142 60)">Data distribution</text>
  <line x1="150" y1="100" x2="150" y2="20" stroke="#333333" stroke-width="1.5" marker-end="url(#tip)"/>
  <line x1="150" y1="100" x2="860" y2="100" stroke="#333333" stroke-width="1.5" marker-end="url(#tip)"/>
  <text x="840" y="92" text-anchor="end" font-size="11" fill="#444444">Time</text>
    <rect x="165" y="68" width="16" height="24" rx="2" fill="#3f6ea8"/>
