<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Data stream mining pipeline</title>
  <desc>Stream of data feeds a data stream mining algorithm that tests and trains, drift detection examines data change, feature selection returns relevant features.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="420" fill="#ffffff"/>

  <!-- boxes -->
  <rect x="20" y="195" width="120" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="80" y="219" text-anchor="middle" fill="#222222">Stream of</text>
  <text x="80" y="237" text-anchor="middle" fill="#222222">Data</text>

  <rect x="270" y="120" width="200" height="210" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="148" text-anchor="middle" fill="#222222">Data Stream</text>
  <text x="370" y="166" text-anchor="middle" fill="#222222">Mining Algorithm</text>
  <rect x="320" y="190" width="100" height="44" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="218" text-anchor="middle" fill="#222222">Test</text>
  <rect x="320" y="256" width="100" height="44" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="370" y="284" text-anchor="middle" fill="#222222">Train</text>

  <rect x="600" y="195" width="160" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="680" y="219" text-anchor="middle" fill="#222222">Concept Drift</text>
  <text x="680" y="237" text-anchor="middle" fill="#222222">Detection</text>

  <rect x="900" y="195" width="120" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="960" y="219" text-anchor="middle" fill="#222222">Feature</text>
  <text x="960" y="237" text-anchor="middle" fill="#222222">Selection</text>

  <!-- forward path -->
  <line x1="140" y1="225" x2="266" y2="225" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="203" y="206" text-anchor="middle" font-size="12" fill="#222222">One Instance</text>
  <text x="203" y="220" text-anchor="middle" font-size="12" fill="#222222">at a Time</text>

  <line x1="470" y1="225" x2="596" y2="225" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="533" y="206" text-anchor="middle" font-size="12" fill="#222222">Examine</text>
  <text x="533" y="220" text-anchor="middle" font-size="12" fill="#222222">Data Change</text>

  <line x1="760" y1="225" x2="896" y2="225" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="828" y="206" text-anchor="middle" font-size="12" fill="#222222">Examine</text>
  <text x="828" y="220" text-anchor="middle" font-size="12" fill="#222222">Involved Features</text>

  <!-- relevant features, back over the top -->
  <path d="M960,195 L960,55 L370,55 L370,116" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="665" y="46" text-anchor="middle" font-size="12" fill="#222222">Relevant Features</text>

  <!-- drift feedback, back under the bottom -->
  <path d="M680,255 L680,400 L370,400 L370,334" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="377" text-anchor="middle" font-size="12" fill="#222222">Adapt a model when a</text>
  <text x="525" y="391" text-anchor="middle" font-size="12" fill="#222222">concept drift is detected</text>

</svg>
