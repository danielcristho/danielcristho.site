<text x="700" y="233.0" font-size="13" fill="#5f6b5c" text-anchor="start">Allow or Deny</text>
<path d="M81.1,241.9C193.4,241.6 342.8,242.8 455.7,242.3C456.5,264.1 455.3,294.1 454.6,316.9C342.8,316.7 192.7,316.2 81.6,317.1C80.8,295.5 81.3,263.8 81.1,241.9Z" fill="none" stroke="#1f7a8c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M457.1,280.0C499.2,282.0 551.3,278.6 592.0,280.0" fill="none" stroke="#1f7a8c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
