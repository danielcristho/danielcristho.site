<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 498" width="980" height="498" font-family="monospace" font-size="14">
<title>Anatomy of an IAM policy</title><desc>An S3 bucket policy in JSON with each key boxed and labelled: Version, Id, Statement, Sid, Effect, Principal, Action, Resource, Condition.</desc>
<rect width="980" height="498" rx="10" fill="#f4f3e6"/>
<text x="32" y="38" font-size="16" fill="#16241d" text-anchor="start" font-weight="bold">Anatomy of an IAM policy</text>
<text x="36" y="78" font-size="14" fill="#16241d" text-anchor="start">{</text>
<text x="53" y="104" font-size="14" fill="#16241d" text-anchor="start">&quot;Version&quot;: &quot;2012-10-17&quot;,</text>
<text x="53" y="130" font-size="14" fill="#16241d" text-anchor="start">&quot;Id&quot;: &quot;notes-bucket-access&quot;,</text>
<text x="53" y="156" font-size="14" fill="#16241d" text-anchor="start">&quot;Statement&quot;: [</text>
<text x="70" y="182" font-size="14" fill="#16241d" text-anchor="start">{</text>
<text x="87" y="208" font-size="14" fill="#16241d" text-anchor="start">&quot;Sid&quot;: &quot;ReadWriteNotes&quot;,</text>
<text x="87" y="234" font-size="14" fill="#16241d" text-anchor="start">&quot;Effect&quot;: &quot;Allow&quot;,</text>
<text x="87" y="260" font-size="14" fill="#16241d" text-anchor="start">&quot;Principal&quot;: {</text>
<text x="103" y="286" font-size="14" fill="#16241d" text-anchor="start">&quot;AWS&quot;: [&quot;arn:aws:iam::111122223333:root&quot;]</text>
<text x="87" y="312" font-size="14" fill="#16241d" text-anchor="start">},</text>
<text x="87" y="338" font-size="14" fill="#16241d" text-anchor="start">&quot;Action&quot;: [&quot;s3:GetObject&quot;, &quot;s3:PutObject&quot;],</text>
<text x="87" y="364" font-size="14" fill="#16241d" text-anchor="start">&quot;Resource&quot;: [&quot;arn:aws:s3:::notes-bucket/*&quot;],</text>
<text x="87" y="390" font-size="14" fill="#16241d" text-anchor="start">&quot;Condition&quot;: {&quot;Bool&quot;: {&quot;aws:SecureTransport&quot;: &quot;true&quot;}}</text>
<text x="70" y="416" font-size="14" fill="#16241d" text-anchor="start">}</text>
<text x="53" y="442" font-size="14" fill="#16241d" text-anchor="start">]</text>
<text x="36" y="468" font-size="14" fill="#16241d" text-anchor="start">}</text>
<path d="M46.6,85.6C109.7,85.8 192.3,86.0 253.9,85.2C252.9,92.8 253.5,103.6 253.3,110.3C191.8,111.3 108.2,111.6 45.8,110.8C46.5,103.7 45.7,92.0 46.6,85.6Z" fill="none" stroke="#b4442f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M254.8,98.0C354.5,97.4 489.2,99.3 592.0,98.0" fill="none" stroke="#b4442f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="600" y="103.0" font-size="14" fill="#b4442f" text-anchor="start" font-weight="bold">Version</text>
<text x="700" y="103.0" font-size="13" fill="#5f6b5c" text-anchor="start">must be &quot;2012-10-17&quot;</text>
<path d="M47.0,112.3C118.9,112.4 215.2,111.4 286.8,112.4C287.2,118.6 285.5,127.5 286.4,134.8C215.3,134.6 119.8,137.2 47.6,136.6C47.4,129.0 47.1,120.0 47.0,112.3Z" fill="none" stroke="#c2701a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M288.5,124.0C380.6,124.5 501.5,122.3 592.0,124.0" fill="none" stroke="#c2701a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="600" y="129.0" font-size="14" fill="#c2701a" text-anchor="start" font-weight="bold">Id</text>
<text x="700" y="129.0" font-size="13" fill="#5f6b5c" text-anchor="start">name of the policy, optional</text>
<path d="M46.0,137.4C85.9,137.9 138.5,137.0 177.5,137.5C177.4,144.4 177.1,152.9 177.0,160.8C138.6,160.3 86.3,162.3 45.8,161.4C44.7,154.1 46.7,145.7 46.0,137.4Z" fill="none" stroke="#9a7b12" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M178.9,150.0C302.6,149.1 466.9,151.8 592.0,150.0" fill="none" stroke="#9a7b12" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="600" y="155.0" font-size="14" fill="#9a7b12" text-anchor="start" font-weight="bold">Statement</text>
<text x="700" y="155.0" font-size="13" fill="#5f6b5c" text-anchor="start">one or more, required</text>
<path d="M79.9,190.2C142.5,190.6 223.2,191.1 285.6,190.1C286.2,195.8 285.8,206.2 287.6,213.1C225.6,212.9 142.3,213.4 81.3,214.0C80.5,207.7 79.1,197.9 79.9,190.2Z" fill="none" stroke="#8b5e34" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
