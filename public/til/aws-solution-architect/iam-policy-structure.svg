<text x="700" y="207.0" font-size="13" fill="#5f6b5c" text-anchor="start">name of the statement, optional</text>
<path d="M81.5,215.5C127.2,214.5 188.4,216.5 235.6,215.7C235.5,224.1 236.0,232.3 237.1,240.2C190.1,239.4 127.0,241.0 80.2,239.8C81.6,233.3 81.5,223.8 81.5,215.5Z" fill="none" stroke="#5d7a1f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M237.9,228.0C345.9,228.2 486.6,226.2 592.0,228.0" fill="none" stroke="#5d7a1f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
