<text x="700" y="285.0" font-size="13" fill="#5f6b5c" text-anchor="start">who it is for</text>
<path d="M79.8,319.0C190.4,318.8 336.1,319.1 446.3,319.0C445.9,326.0 445.0,335.6 446.0,343.4C337.6,343.0 190.3,344.8 80.7,344.9C81.3,336.5 79.6,326.2 79.8,319.0Z" fill="none" stroke="#7e3fa8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M448.6,332.0C491.2,331.8 550.8,333.4 592.0,332.0" fill="none" stroke="#7e3fa8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="600" y="337.0" font-size="14" fill="#7e3fa8" text-anchor="start" font-weight="bold">Action</text>
<text x="700" y="337.0" font-size="13" fill="#5f6b5c" text-anchor="start">which API calls</text>
<path d="M81.5,344.9C193.0,346.4 343.0,346.9 453.9,346.5C455.7,352.9 454.5,362.1 456.0,369.9C343.5,370.0 194.4,369.7 80.8,368.8C81.3,362.3 81.2,352.2 81.5,344.9Z" fill="none" stroke="#2e8555" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M457.1,358.0C495.7,359.1 550.5,359.7 592.0,358.0" fill="none" stroke="#2e8555" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
<text x="600" y="363.0" font-size="14" fill="#2e8555" text-anchor="start" font-weight="bold">Resource</text>
<text x="700" y="363.0" font-size="13" fill="#5f6b5c" text-anchor="start">which ARNs</text>
<path d="M80.9,371.5C220.8,371.7 406.8,370.8 546.9,371.4C547.5,377.8 547.3,388.9 548.1,396.5C408.7,396.4 221.1,395.4 79.6,395.0C79.4,387.3 81.7,379.1 80.9,371.5Z" fill="none" stroke="#5f6b5c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
